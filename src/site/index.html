<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微光博物館｜引路人文創園區</title>
<meta name="description" content="白天，你是老師；熄燈後，你是你自己。引路人的夜間博物館：老師台下的人生，薪水、退休、測驗與遊戲。">
<meta property="og:title" content="微光博物館｜引路人文創園區">
<meta property="og:description" content="白天，你是老師；熄燈後，你是你自己。到夜間售票口領一張票，逛逛老師台下的人生。">
<meta name="theme-color" content="#070d1a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="museum.css">
<link rel="stylesheet" href="inside.css">
</head>
<body class="is-lit at-booth">

<!-- 大廳：牆、天花板線腳、兩側拱窗、吊燈、石地板。售票口、票、熄燈共用 -->
<div class="hall" aria-hidden="true">
  <div class="hall-wall"></div>
  <div class="hall-cornice"></div>
  <div class="hall-windows" id="hall-windows"></div>
  <div class="hall-lamps" id="lamps"></div>
  <div class="hall-floor"><div class="floor-tiles"></div></div>
  <div class="hall-grain"></div>
</div>

<!-- 一、夜間售票口 -->
<section class="scene booth-scene" id="booth-scene" aria-labelledby="booth-title">
  <div class="lobby">
    <header class="scene-head">
      <p class="kicker">Museum of Glimmers</p>
      <h1 class="title" id="booth-title">微光博物館</h1>
    </header>
    <!-- 掛在牆上的樓層牌：點一行，向售票窗買那一層的票 -->
    <div class="wall-sign">
      <span class="ws-rod l" aria-hidden="true"></span><span class="ws-rod r" aria-hidden="true"></span>
      <div class="ws-board">
        <p class="ws-head">今晚，想去哪裡走走？<i>Where to, tonight?</i></p>
        <div class="zones" id="zones" role="group" aria-label="選一個展區"></div>
      </div>
      <p class="ws-hint">點一個展區，向售票窗買票</p>
    </div>
    <div class="lobby-gap"></div>
    <!-- 售票亭：拱頂山牆、凹槽壁柱、拱形暖光窗、通話孔、大理石檯面、出票口、鑲板台座 -->
    <div class="booth" id="booth">
      <div class="booth-crown" aria-hidden="true">
        <svg class="crown-emblem" viewBox="0 0 30 38"><use href="#emblem"/></svg>
      </div>
      <div class="booth-cornice" aria-hidden="true"></div>
      <div class="booth-body">
        <span class="pilaster l" aria-hidden="true"></span><span class="pilaster r" aria-hidden="true"></span>
        <div class="booth-frame">
          <div class="booth-glass">
            <div class="booth-board">
              <p class="bb-sign">夜間售票</p>
              <p class="bb-en">Night Admission</p>
            </div>
            <span class="booth-grille" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="booth-ledge"><span class="booth-slot" id="booth-slot"></span></div>
      <div class="booth-base" aria-hidden="true"><span class="booth-panel"></span></div>
      <div class="booth-plinth" aria-hidden="true"></div>
    </div>
    <div class="lobby-floor">
      <div class="floor-tiles" aria-hidden="true"></div>
      <button class="link-btn skip" id="skip" type="button">略過，直接進館</button>
      <footer class="site-foot" id="site-foot"></footer>
    </div>
  </div>
</section>

<!-- 二、今晚的票 -->
<section class="scene ticket-scene" id="ticket-scene" hidden aria-labelledby="tk-zone">
  <div class="ticket-stage">
    <article class="ticket" id="ticket">
      <div class="tk tk-main">
        <span class="tk-frame"><i></i><i></i></span>
        <div class="tk-in">
          <svg class="tk-emblem" viewBox="0 0 30 38" aria-hidden="true"><use href="#emblem"/></svg>
          <p class="tk-museum foil">Museum of Glimmers</p>
          <p class="tk-name">微光博物館</p>
          <p class="tk-numeral foil" id="tk-numeral">II</p>
          <h2 class="tk-zone" id="tk-zone"></h2>
          <p class="tk-zone-en" id="tk-zone-en"></p>
          <div class="tk-rule"></div>
          <p class="tk-quote" id="tk-quote"></p>
          <p class="tk-quote-en" id="tk-quote-en"></p>
          <p class="tk-sign">夜班警衛　Night Guard</p>
        </div>
      </div>
      <div class="tk tk-stub">
        <div class="tk-in tk-stub-row">
          <span class="tk-adm">夜間入館券<i>Night Admission</i></span>
          <span class="tk-date foil" id="tk-date"></span>
        </div>
      </div>
    </article>
    <div class="tk-actions">
      <button class="btn" id="tk-go" type="button">前往</button>
      <div class="tk-minor">
        <button class="link-btn" id="tk-save" type="button">存下這張票根</button>
        <button class="link-btn" id="tk-again" type="button">換一個展區</button>
      </div>
    </div>
  </div>
</section>

<!-- 三、熄燈 -->
<section class="scene night-scene" id="night-scene" hidden aria-live="polite">
  <div class="night-words">
    <p class="nw-1">白天，你是老師；</p>
    <p class="nw-2">熄燈後，你是你自己。</p>
  </div>
</section>

<!-- 四、館內：夜遊（提著手電筒走）／全覽（燈全亮，館藏目錄） -->
<section class="scene inside-scene" id="inside-scene" hidden aria-label="館內">
  <div class="in-hud">
    <button class="link-btn hud-back" id="hud-back" type="button">← 售票口</button>
    <div class="mode-switch" id="mode-switch" role="group" aria-label="參觀方式">
      <span class="ms-thumb" aria-hidden="true"></span>
      <button type="button" data-mode="walk" aria-pressed="true">夜遊<i>Wander</i></button>
      <button type="button" data-mode="catalog" aria-pressed="false">全覽<i>Overview</i></button>
    </div>
  </div>
  <div class="walk" id="walk" hidden></div>
  <div class="catalog" id="catalog" hidden></div>
  <div class="in-veil" id="in-veil" aria-hidden="true"></div>
</section>

<!-- 展品說明牌 -->
<div class="placard-veil" id="placard" hidden>
  <article class="placard" role="dialog" aria-modal="true" aria-labelledby="pl-title">
    <button class="pl-close" id="pl-close" type="button" aria-label="關閉">×</button>
    <div class="pl-case" id="pl-case"></div>
    <div class="pl-label">
      <p class="pl-floor" id="pl-floor"></p>
      <h3 class="pl-title" id="pl-title"></h3>
      <p class="pl-en" id="pl-en"></p>
      <dl class="pl-meta" id="pl-meta"></dl>
      <p class="pl-note" id="pl-note"></p>
      <ul class="pl-tags" id="pl-tags"></ul>
      <div class="pl-links" id="pl-links"></div>
      <p class="pl-disclaimer" id="pl-disclaimer" hidden>個人研究參考，不構成投資建議。</p>
    </div>
  </article>
</div>

<p class="toast" id="toast" role="status" hidden></p>

<!-- 燈籠館徽：售票亭山牆、票、館內共用 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="emblem-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a8"/><stop offset=".5" stop-color="#d4a64a"/><stop offset="1" stop-color="#9c742c"/></linearGradient>
    <g id="emblem">
      <circle cx="15" cy="3.2" r="2.4" fill="none" stroke="url(#emblem-gold)" stroke-width="1.2"/>
      <path d="M7 11 L23 11 L19.5 6 L10.5 6 Z" fill="url(#emblem-gold)"/>
      <rect x="8" y="11" width="14" height="19" fill="none" stroke="url(#emblem-gold)" stroke-width="1.2"/>
      <path d="M15 15 C18.5 19.5 18.5 23 15 25.5 C11.5 23 11.5 19.5 15 15 Z" fill="url(#emblem-gold)"/>
      <rect x="6" y="30" width="18" height="3.2" rx="1" fill="url(#emblem-gold)"/>
      <path d="M9 33.2 L10.5 37 L19.5 37 L21 33.2 Z" fill="url(#emblem-gold)"/>
    </g>
  </defs>
</svg>

<script>window.MUSEUM = /*MUSEUM_DATA*/null;</script>
<script type="module" src="museum.js"></script>
</body>
</html>
