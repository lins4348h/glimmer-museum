<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 大廳試做｜微光博物館</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070d1a">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="lab.css">
</head>
<body class="is-day">
<!-- 微光博物館｜3D 大廳試做版（使用者要比較：參考圖那種斜俯視 3D vs 現在的像素地圖）。正式網站不連到這裡。 -->
<div class="stage" id="stage"></div>
<div class="layer" id="layer"></div>

<header class="hud">
  <a class="back" href="../">← 回到現在的館</a>
  <p class="badge">3D 試做版<i>Prototype</i></p>
  <button class="daynight" id="daynight" type="button" aria-pressed="false" aria-label="熄燈，切到夜晚" title="熄燈，切到夜晚">
    <span class="dn-sun" aria-hidden="true"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.2v2.4M10 15.4v2.4M2.2 10h2.4M15.4 10h2.4M4.5 4.5l1.7 1.7M13.8 13.8l1.7 1.7M4.5 15.5l1.7-1.7M13.8 6.2l1.7-1.7"/></svg></span>
    <span class="dn-moon" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M14.6 12.9A6.4 6.4 0 0 1 7.1 5.4a6.4 6.4 0 1 0 7.5 7.5Z"/></svg></span>
  </button>
</header>

<p class="banner" id="banner" hidden></p>
<p class="help" id="help"></p>
<div class="joy" id="joy" hidden><span></span></div>
<p class="loading" id="loading">佈展中…</p>

<!-- 說明牌（跟正式網站同一種：左邊線稿、右邊暖紙展籤） -->
<div class="veil" id="placard" hidden>
  <article class="placard" role="dialog" aria-modal="true" aria-labelledby="pl-title">
    <button class="pl-close" id="pl-close" type="button" aria-label="關閉">×</button>
    <div class="pl-art" id="pl-art"></div>
    <div class="pl-label">
      <p class="pl-floor" id="pl-floor"></p>
      <h3 class="pl-title" id="pl-title"></h3>
      <p class="pl-en" id="pl-en"></p>
      <p class="pl-quip" id="pl-quip" hidden></p>
      <p class="pl-note" id="pl-note"></p>
      <div class="pl-links" id="pl-links"></div>
    </div>
  </article>
</div>

<script type="module" src="hall3d.js"></script>
</body>
</html>
